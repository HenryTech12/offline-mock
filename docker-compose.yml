services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ['8000:8000']
    env_file: .env
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes: ['./frontend:/app']
    command: sh -c 'npm install && npm run dev -- --host 0.0.0.0'
    ports: ['5173:5173']
